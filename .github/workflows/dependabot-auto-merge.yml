name: dependabot auto-merge

# Merges low-risk Dependabot PRs without a human, so routine dependency maintenance stops depending
# on somebody remembering to look. Patch and minor only — majors always wait for a person.
#
# This does NOT merge anything on its own: it asks GitHub to enable auto-merge, and GitHub then
# merges only once every required status check on `main` has passed. The required checks are what
# make "on green CI" true, so this workflow is only meaningful on a repository that has them. See
# the Dependency Maintenance section of README.md.
#
# NOTE: this file is export-ignored in .gitattributes and does not ship into projects scaffolded
# from the kit. It depends on repository settings ("Allow auto-merge", plus required status checks)
# that a fresh repo will not have, and without them a PR is immediately mergeable — so the same file
# in a fresh repo would merge dependency updates with no CI gate at all. The `github.repository`
# guard below is a second line of defence for exactly that case.

on: pull_request

# `pull_request`, not `pull_request_target`, following GitHub's documented sample. Dependabot-triggered
# runs get a read-only token by default, which this block lifts for the two scopes actually needed.
# Nothing here checks out or executes PR code — it reads metadata and calls the API — so none of the
# usual pull_request_target risks are in play.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    # Second condition means a copy of this file in a fork or scaffolded project does nothing.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'artisan-build/laravel-nodeless'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Written as an allowlist rather than `!= 'version-update:semver-major'` so it fails closed:
      # an empty or unrecognised update-type blocks the merge instead of allowing it. For a grouped
      # PR this is the highest bump in the group, so one minor among patches is treated as a minor.
      - name: Enable auto-merge for patch and minor updates
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
